<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace Switcher Dropdown Preview</title>
    <style>
      :root {
        --bg: #eef1f7;
        --surface: #ffffff;
        --panel: #f8fafc;
        --border: #d6dce6;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #b7791f;
        --primary-soft: rgba(183, 121, 31, 0.12);
        --shadow: 0 28px 80px -32px rgba(15, 23, 42, 0.38);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(183, 121, 31, 0.08), transparent 36%), var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }

      .shell {
        max-width: 1560px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        border-radius: 0 0 20px 20px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 14px;
        background: transparent;
        color: var(--text);
        font-weight: 600;
      }

      .button.primary {
        color: var(--primary);
      }

      .panel {
        width: min(496px, calc(100vw - 24px));
        margin-top: 18px;
        border: 1px solid var(--border);
        border-radius: 24px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .search {
        padding: 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      input {
        width: 100%;
        height: 42px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        color: var(--text);
        font-size: 14px;
      }

      .section {
        padding: 12px 14px 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .item {
        display: flex;
        gap: 12px;
        align-items: start;
        width: 100%;
        padding: 10px 14px;
        text-align: left;
        border: 1px solid transparent;
        border-radius: 16px;
        background: transparent;
        color: var(--text);
      }

      .item.selected {
        border-color: rgba(183, 121, 31, 0.2);
        background: var(--primary-soft);
        box-shadow: 0 8px 22px -16px rgba(183, 121, 31, 0.5);
      }

      .icon {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--primary);
        flex: 0 0 auto;
      }

      .icon.selected {
        background: white;
        border-color: rgba(183, 121, 31, 0.2);
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .title {
        font-weight: 600;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid rgba(183, 121, 31, 0.2);
        background: rgba(183, 121, 31, 0.1);
        color: var(--primary);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .empty {
        margin: 0 14px;
        padding: 14px;
        border: 1px dashed var(--border);
        border-radius: 16px;
        color: var(--muted);
        font-size: 14px;
        background: var(--bg);
      }

      .footer {
        padding: 10px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .workspace-create {
        margin-top: 18px;
        display: grid;
        gap: 14px;
        max-width: 496px;
        padding: 18px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .workspace-create h2 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: -0.04em;
      }

      .workspace-create p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .row {
        display: grid;
        gap: 8px;
      }

      .label {
        font-size: 14px;
        font-weight: 600;
      }

      .submit {
        height: 44px;
        border: 0;
        border-radius: 16px;
        background: var(--primary);
        color: white;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <button class="button primary">Project Eclipse ▾</button>
        <button class="button">Kai Rivera ▾</button>
      </div>

      <div class="panel">
        <div class="search">
          <input value="Search workspaces" />
        </div>

        <div class="section">Current workspace</div>
        <button class="item selected">
          <div class="icon selected">◁▷</div>
          <div>
            <div class="title-row">
              <span class="title">Project Eclipse</span>
              <span class="badge">Current</span>
            </div>
            <div class="sub">active / Godot / Milestone 03</div>
          </div>
        </button>

        <div class="section">Recent workspaces</div>
        <button class="item">
          <div class="icon">◁▷</div>
          <div>
            <div class="title-row">
              <span class="title">Moonlit Vale</span>
            </div>
            <div class="sub">active / Unknown engine / Draft review</div>
          </div>
        </button>
        <button class="item">
          <div class="icon">◁▷</div>
          <div>
            <div class="title-row">
              <span class="title">Hollow Sun</span>
            </div>
            <div class="sub">draft / Godot / Asset pass</div>
          </div>
        </button>
        <button class="item">
          <div class="icon">◁▷</div>
          <div>
            <div class="title-row">
              <span class="title">Ash Harbor</span>
            </div>
            <div class="sub">archived / Godot / Old export set</div>
          </div>
        </button>

        <div class="footer">
          <button class="item" style="width: 100%;">
            <div class="icon" style="border-style: dashed;">+</div>
            <div>
              <div class="title">+ Workspace</div>
              <div class="sub">Create and jump into a new workspace</div>
            </div>
          </button>
        </div>
      </div>

      <div class="workspace-create">
        <div>
          <p style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);">New workspace</p>
          <h2>Create workspace</h2>
          <p>Create a workspace from the header and route directly into <code>/w/[workspaceId]</code>.</p>
        </div>
        <div class="row">
          <div class="label">Workspace name</div>
          <input value="Project Eclipse" />
        </div>
        <button class="submit">Create workspace</button>
      </div>
    </div>
  </body>
</html>
